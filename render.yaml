# Render Blueprint: one free web service. FastAPI serves the API and the built React dashboard.
services:
  - type: web
    name: reviewlens
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false # entered in the Render dashboard, never committed
      - key: NODE_VERSION
        value: "24"
